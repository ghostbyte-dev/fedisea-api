services:
  fedisea-api:
    image: ghcr.io/ghostbyte-dev/fedisea-api:latest
    env_file:
      - .env
    networks:
      - fedisea-network
      - proxy-network
    volumes:
      - fedisea_icons:/app/icons
    restart: always

  icon-server:
    image: nginx:alpine
    container_name: icon-server
    volumes:
      - fedisea_icons:/usr/share/nginx/html:ro
      - ./nginx-icon-server.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy-network

volumes:
  fedisea_icons:
    driver: local

networks:
  fedisea-network:
    external: true
  proxy-network:
    external: true